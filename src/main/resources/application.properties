spring.application.name=goldenticket2


# Server
server.port=${SERVER_PORT:8080}

# MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/golden_ticket?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Bogota}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota

# JWT
